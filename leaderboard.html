<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b16"><title>QuantumFlow • Leaderboard</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme.css"></head><body><main class="wrap" id="leaderboard"><div class="card"><h2>Loading leaderboard…</h2><p class="muted">Finding the QuantumFlow leaders.</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
const root=document.getElementById('leaderboard');const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function theme(){const t=localStorage.getItem('quantumflow-theme')||'dark';document.documentElement.dataset.theme=t;}
function toggleTheme(){const n=document.documentElement.dataset.theme==='light'?'dark':'light';localStorage.setItem('quantumflow-theme',n);theme();render(cache)}
let cache=[];
async function load(){theme();try{const {data:{session}}=await supabaseClient.auth.getSession();if(!session){root.innerHTML='<div class="card"><h2>🔐 Sign in required</h2><p class="muted">Sign in to QuantumFlow to view the leaderboard.</p><a class="btn" href="./">Open QuantumFlow</a></div>';return}const {data,error}=await supabaseClient.rpc('leaderboard',{limit_count:50});if(error)throw error;cache=data||[];render(cache)}catch(e){root.innerHTML='<div class="card"><h2>Could not load leaderboard</h2><p class="notice error">'+esc(e.message)+'</p><button class="btn" onclick="load()">Retry</button></div>'}}
function render(rows){const mine=rows.find(r=>r.display_name);root.innerHTML='<div class="top"><div><div class="brand">QuantumFlow</div><h1>🏆 Leaderboard</h1><div class="muted">Compete through consistency, not spam.</div></div><div class="actions"><button class="theme-toggle" onclick="toggleTheme()">☀️ / 🌙</button><a class="btn secondary" href="./">Back to app</a></div></div><div class="card hero"><div class="muted">TOP PERFORMERS</div><div class="podium">'+rows.slice(0,3).map((r,i)=>'<div class="podium-item '+(['gold','silver','bronze'][i]||'')+'"><div class="medal">'+(['🥇','🥈','🥉'][i])+'</div><strong>#'+r.rank+' '+esc(r.display_name)+'</strong><span>'+Number(r.xp||0)+' XP</span><small>🔥 '+Number(r.streak_days||0)+' day streak</small></div>').join('')+'</div></div><div class="card"><div class="row between"><div><h2>Global Ranking</h2><div class="muted">Public profiles only</div></div><button class="btn secondary" onclick="load()">↻ Refresh</button></div><div class="list">'+(rows.length?rows.map(r=>'<div class="item rank-row"><span class="rank">#'+r.rank+'</span><div class="grow"><b>'+esc(r.display_name)+'</b><div class="muted">🔥 '+Number(r.streak_days||0)+' day streak</div></div><span class="pill">⚡ '+Number(r.xp||0)+' XP</span></div>').join(''):'<p class="empty">No public players yet.</p>')+'</div></div><p class="muted small" style="text-align:center">Leaderboard visibility can be turned off in your profile settings.</p>'}
load();
</script><style>.wrap{max-width:900px;margin:auto;padding:20px 16px 50px}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.podium-item{text-align:center;padding:18px 8px;border:1px solid var(--border);border-radius:18px;background:var(--surface2)}.podium-item strong,.podium-item span,.podium-item small{display:block;margin-top:6px}.medal{font-size:32px}.rank-row{padding:13px 0}.rank{width:52px;font-weight:900;font-size:18px}.notice{padding:12px;border-radius:12px}.error{background:rgba(239,68,68,.1)}@media(max-width:600px){.podium{grid-template-columns:1fr}.podium-item:first-child{order:-1}}
</style></body></html>
