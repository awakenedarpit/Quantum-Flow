<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuantumFlow • Study Planner</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme.css"></head><body><main style="max-width:1000px;margin:auto;padding:20px 16px 50px"><header style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><div class="badge">QUANTUMFLOW • STUDY</div><h1>Study Planner</h1><p class="muted">Plan your study and customize every focus session.</p></div><div style="display:flex;gap:8px"><button class="theme-toggle" id="theme">🌙</button><a class="btn" href="./">Home</a></div></header><section class="card" style="padding:18px;margin-top:16px"><h2>Today's plan</h2><div id="plan" class="muted">Loading…</div></section><section class="card" style="padding:18px;margin-top:14px"><h2>Add study plan</h2><form id="form" style="display:grid;gap:10px"><input id="title" required placeholder="e.g. DSA — Arrays practice"><input id="date" type="date" required><input id="minutes" type="number" min="10" value="30" placeholder="Minutes"><select id="priority"><option value="normal">Normal priority</option><option value="high">High priority</option><option value="low">Low priority</option></select><button class="btn">Add to plan</button></form><p id="msg" class="muted"></p></section><section class="card" style="padding:18px;margin-top:14px"><h2>⏱️ Custom Focus Session</h2><p class="muted">Choose how long you want to focus. Your last setting is remembered.</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0"><button class="btn secondary preset" data-min="15">15 min</button><button class="btn secondary preset" data-min="25">25 min</button><button class="btn secondary preset" data-min="45">45 min</button><button class="btn secondary preset" data-min="60">60 min</button><label class="badge">Custom <input id="customMin" type="number" min="1" max="180" value="25" style="width:65px;margin-left:5px"> min</label><button class="btn" id="setCustom">Set</button></div><div style="font-size:52px;font-weight:800;text-align:center;margin:12px" id="timer">25:00</div><p id="timerStatus" class="muted" style="text-align:center">Ready</p><div style="display:flex;justify-content:center;gap:8px"><button class="btn" id="start">Start</button><button class="btn secondary" id="reset">Reset</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>const $=id=>document.getElementById(id);const today=new Date().toISOString().slice(0,10);$('date').value=today;let session=null;async function load(){const r=await supabaseClient.auth.getSession();session=r.data.session;if(!session){$('plan').innerHTML='<a class="btn" href="./">Sign in to use Study Planner</a>';return}await render()}async function render(){const {data,error}=await supabaseClient.from('study_plans').select('*').eq('user_id',session.user.id).eq('planned_date',$('date').value).order('created_at');if(error){$('plan').textContent=error.message;return}$('plan').innerHTML=(data||[]).length?(data||[]).map(p=>`<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)"><span><b>${p.title}</b><br><small class="muted">${p.planned_minutes} min • ${p.priority}</small></span><button class="btn ${p.completed?'secondary':''}" onclick="complete('${p.id}',${p.completed})">${p.completed?'✓ Done':'Complete + XP'}</button></div>`).join(''):'<div class="empty">No study plans for this day.</div>'}async function complete(id,done){if(done)return;const {error}=await supabaseClient.from('study_plans').update({completed:true}).eq('id',id).eq('user_id',session.user.id);if(error){alert(error.message);return}await supabaseClient.rpc('grant_xp',{p_event_key:'study_plan_complete',p_source_id:id,p_points:30});render()}$('form').onsubmit=async e=>{e.preventDefault();if(!session)return;const {error}=await supabaseClient.from('study_plans').insert({user_id:session.user.id,title:$('title').value.trim(),planned_date:$('date').value,planned_minutes:+$('minutes').value,priority:$('priority').value});$('msg').textContent=error?error.message:'Plan added!';if(!error){$('title').value='';render()}};
let defaultMin=Number(localStorage.getItem('qf-focus-min')||25);let sec=defaultMin*60,run=null;function clock(){$('timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}function setMinutes(m){m=Math.max(1,Math.min(180,Math.round(Number(m)||25)));defaultMin=m;localStorage.setItem('qf-focus-min',m);$('customMin').value=m;if(!run){sec=m*60;clock();$('timerStatus').textContent=m+' minute session ready'}}document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>setMinutes(b.dataset.min));$('setCustom').onclick=()=>setMinutes($('customMin').value);$('start').onclick=()=>{if(run){clearInterval(run);run=null;$('start').textContent='Resume';$('timerStatus').textContent='Paused'}else{if(sec<=0)sec=defaultMin*60;run=setInterval(()=>{if(sec>0){sec--;clock()}else{clearInterval(run);run=null;$('start').textContent='Start';$('timerStatus').textContent='Session complete 🎉';if(session)supabaseClient.rpc('grant_xp',{p_event_key:'focus_session',p_source_id:crypto.randomUUID(),p_points:20})}},1000);$('start').textContent='Pause';$('timerStatus').textContent='Focusing…'}};$('reset').onclick=()=>{clearInterval(run);run=null;sec=defaultMin*60;clock();$('start').textContent='Start';$('timerStatus').textContent=defaultMin+' minute session ready'};setMinutes(defaultMin);const saved=localStorage.getItem('qf-theme')||'dark';document.documentElement.dataset.theme=saved==='light'?'light':'dark';$('theme').textContent=saved==='light'?'☀️':'🌙';$('theme').onclick=()=>{const n=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=n;localStorage.setItem('qf-theme',n);$('theme').textContent=n==='light'?'☀️':'🌙'};load()</script></body></html>
