<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="description" content="QuantumFlow habit, goal, study and progress tracker"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme.css"><title>QuantumFlow</title></head><body><div id="app"></div><nav id="nav"></nav><div id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="app.js"></script><script src="xp-bridge.js"></script><script src="auth-fix.js"></script><script src="v2-hub.js"></script><script src="qf-community.js"></script><style>.qf-hub{margin-top:16px;padding:18px}.qf-hub-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.qf-kicker{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--primary)}.qf-hub h2{margin:4px 0}.qf-xp{margin-top:14px;padding:14px;border:1px solid var(--border);border-radius:16px;background:var(--surface2)}.qf-xp strong{display:block;font-size:30px;margin:3px 0}.qf-xpbar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin:9px 0}.qf-xpbar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--primary),var(--secondary))}.qf-feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.qf-feature{display:flex;flex-direction:column;gap:5px;padding:13px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);text-decoration:none}.qf-feature:hover{transform:translateY(-1px);border-color:var(--primary)}.qf-feature span{font-size:12px;color:var(--muted)}.qf-hub-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12px}.qf-hub-foot a{color:var(--secondary);text-decoration:none}@media(max-width:650px){#app{padding-bottom:86px}.qf-feature-grid{grid-template-columns:1fr}}</style></body></html>
