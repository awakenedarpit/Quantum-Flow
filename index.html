<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="description" content="QuantumFlow habit and study tracker"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme.css"><title>QuantumFlow</title></head><body><div id="app"></div><nav id="nav"></nav><div id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="app.js"></script><script src="auth-fix.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const n=document.getElementById('nav');if(!n)return;const links=[['🏠','Home','./'],['✅','Habits','./#habits'],['📚','Study','study.html'],['🎯','Goals','./#goals'],['📊','Progress','progress.html'],['🏆','Leaderboard','leaderboard-v2.html'],['👤','Profile','./#profile']];n.innerHTML='<div class="qf-nav">'+links.map(x=>`<a href="${x[2]}"><span>${x[0]}</span>${x[1]}</a>`).join('')+'</div>';});</script><style>.qf-nav{position:fixed;z-index:50;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:7px;border:1px solid var(--border);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);border-radius:18px;box-shadow:var(--shadow);max-width:calc(100% - 18px);overflow:auto}.qf-nav a{color:var(--text);text-decoration:none;padding:8px 10px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;white-space:nowrap}.qf-nav a:hover{background:var(--surface2)}.qf-nav span{font-size:18px}@media(max-width:650px){#app{padding-bottom:86px}.qf-nav a{padding:7px 8px}.qf-nav{width:max-content;max-width:calc(100% - 12px)}}@media(min-width:651px){.qf-nav{top:12px;bottom:auto;left:auto;right:16px;transform:none}}</style></body></html>
