<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b16"><title>QuantumFlow • Progress</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme.css"></head><body><main style="max-width:1100px;margin:auto;padding:20px 16px 50px"><header style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px"><div><div class="badge">QUANTUMFLOW • PROGRESS</div><h1>Habit Progress</h1><p class="muted">See your consistency, streaks and daily activity.</p></div><div style="display:flex;gap:8px"><button class="theme-toggle" id="theme">🌙</button><a class="btn" href="./">Home</a></div></header><section class="stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px"><div class="card" style="padding:18px"><small class="muted">🔥 Current streak</small><h2 id="streak">—</h2></div><div class="card" style="padding:18px"><small class="muted">🏆 Best streak</small><h2 id="best">—</h2></div><div class="card" style="padding:18px"><small class="muted">✅ Completed</small><h2 id="done">—</h2></div><div class="card" style="padding:18px"><small class="muted">❌ Missed</small><h2 id="missed">—</h2></div></section><section class="card" style="padding:18px;margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center"><div><h2>Activity heatmap</h2><p class="muted">Your last 12 weeks</p></div><span class="badge" id="rate">—%</span></div><div id="heat" style="display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin-top:16px"></div><div class="muted" style="font-size:12px;margin-top:10px">Less ▫️ ▪️ ◼️ More</div></section><section class="card" style="padding:18px;margin-top:14px"><h2>Daily activity</h2><div id="days" class="muted">Sign in to load your activity.</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>const t=document.getElementById('theme');const saved=localStorage.getItem('qf-theme')||'dark';document.documentElement.dataset.theme=saved==='light'?'light':'dark';t.textContent=saved==='light'?'☀️':'🌙';t.onclick=()=>{const n=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=n;localStorage.setItem('qf-theme',n);t.textContent=n==='light'?'☀️':'🌙'};const heat=document.getElementById('heat');const days=document.getElementById('days');async function init(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session){days.innerHTML='<a class="btn" href="./">Sign in to QuantumFlow</a>';return}const {data,error}=await supabaseClient.from('habit_completions').select('completed_on').eq('user_id',session.user.id).gte('completed_on',new Date(Date.now()-83*864e5).toISOString().slice(0,10));if(error){days.textContent=error.message;return}const map={};(data||[]).forEach(x=>map[x.completed_on]=(map[x.completed_on]||0)+1);const dates=[];for(let i=83;i>=0;i--){const d=new Date(Date.now()-i*864e5),k=d.toISOString().slice(0,10);dates.push({k,n:map[k]||0})}const total=dates.reduce((a,x)=>a+x.n,0);const active=dates.filter(x=>x.n>0).length;document.getElementById('done').textContent=total;document.getElementById('missed').textContent=84-active;document.getElementById('rate').textContent=Math.round(active/84*100)+'%';let cur=0,best=0;for(let i=dates.length-1;i>=0&&dates[i].n>0;i--)cur++;let run=0;dates.forEach(x=>{if(x.n){run++;best=Math.max(best,run)}else run=0});document.getElementById('streak').textContent=cur+' days';document.getElementById('best').textContent=best+' days';heat.innerHTML=dates.map(x=>'<span title="'+x.k+': '+x.n+' completed" style="aspect-ratio:1;border-radius:4px;background:'+(x.n===0?'var(--surface2)':x.n===1?'color-mix(in srgb,var(--success) 35%,var(--surface2))':x.n<4?'color-mix(in srgb,var(--success) 65%,var(--surface2))':'var(--success)')+'"></span>').join('');days.innerHTML=dates.slice(-14).reverse().map(x=>'<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)"><span>'+x.k+'</span><b class="color-success">'+x.n+' completed</b></div>').join('')}init();</script></body></html>
