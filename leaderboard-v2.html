<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuantumFlow • Leaderboard</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme.css"></head><body><main style="max-width:900px;margin:auto;padding:20px 16px 50px"><header style="display:flex;justify-content:space-between;align-items:center"><div><div class="badge">QUANTUMFLOW • COMMUNITY</div><h1>🏆 Leaderboard</h1><p class="muted">Compete through consistent, productive progress.</p></div><button class="theme-toggle" id="theme">🌙</button></header><section class="card" style="padding:18px;margin-top:16px"><div id="me" class="muted">Loading…</div><div id="board" style="margin-top:14px"></div></section><p class="muted" style="font-size:12px;margin-top:12px">Only users who choose to appear on the leaderboard are shown. Emails are never displayed.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session){$('me').innerHTML='<a class="btn" href="./">Sign in to view leaderboard</a>';return}const {data,error}=await supabaseClient.rpc('leaderboard_top',{p_limit:50});if(error){$('board').textContent=error.message;return}const rows=data||[],mine=rows.find(x=>x.user_id===session.user.id);$('me').innerHTML=mine?`<div class="badge">YOUR RANK #${mine.rank} • ⚡ ${mine.xp} XP</div>`:'<div class="badge">You are not currently visible on the leaderboard.</div>';$('board').innerHTML=rows.length?rows.map((r,i)=>`<div style="display:grid;grid-template-columns:50px 1fr auto;align-items:center;gap:10px;padding:13px 8px;border-bottom:1px solid var(--border);${r.user_id===session.user.id?'background:color-mix(in srgb,var(--primary) 12%,transparent);border-radius:12px':''}"><strong>${r.rank<=3?['🥇','🥈','🥉'][r.rank-1]:'#'+r.rank}</strong><span><b>${esc(r.display_name)}</b><br><small class="muted">Consistency matters more than perfection.</small></span><b class="color-goal">⚡ ${r.xp}</b></div>`).join(''):'<div class="empty">No public leaderboard users yet.</div>'}const saved=localStorage.getItem('qf-theme')||'dark';document.documentElement.dataset.theme=saved==='light'?'light':'dark';$('theme').textContent=saved==='light'?'☀️':'🌙';$('theme').onclick=()=>{const n=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=n;localStorage.setItem('qf-theme',n);$('theme').textContent=n==='light'?'☀️':'🌙'};load()</script></body></html>
